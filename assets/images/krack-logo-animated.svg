<svg version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" x="0" y="0"
	 viewBox="0 0 200 100" xml:space="preserve">

<style type="text/css">
	@media (prefers-color-scheme: dark) {
		.signet { fill: #CD1929; }
	}

	.signet {
		fill: #CD1929;
	}

	.letter {
		--timing-factor: 1.0;
		opacity: 0;
		transform: translateX(var(--offset-x)) translateY(var(--offset-y));
		/* animation: move-k1 0.5s ease-in-out forwards; */
	}

	.letter-k1 {
		--offset-x: -10px;
		--offset-y: -30px;
		animation: move-k1 0.5s ease-in-out forwards;
		animation-name: move-k1;
		animation-delay: calc(1.0s * var(--timing-factor));
	}

	.letter-r {
		--offset-x: -25px;
		--offset-y: 35px;
		animation: move-k1 0.5s ease-in-out forwards;
		animation-name: move-r;
		animation-delay: calc(1.5s * var(--timing-factor));
	}

	.letter-a {
		--offset-x: -20px;
		--offset-y: -10px;
		animation: move-k1 0.5s ease-in-out forwards;
		animation-name: move-a;
		animation-delay: calc(1.25s * var(--timing-factor));
	}

	.letter-c {
		--offset-x: -5px;
		--offset-y: 16px;
		animation: move-k1 0.5s ease-in-out forwards;
		animation-name: move-c;
		animation-delay: calc(1.15s * var(--timing-factor));
	}

	.letter-k2 {
		--offset-x: 10px;
		--offset-y: -18px;
		animation: move-k1 0.5s ease-in-out forwards;
		animation-name: move-k2;
		animation-delay: calc(1.4s * var(--timing-factor));
	}

	@keyframes move-k1 {
		0% { transform: translateX(var(--offset-x)) translateY(var(--offset-y)); }
		15% { opacity: 1; }
		50% { transform: translateX(-2px) translateY(-25px); }
		100% { transform: translateX(0px) translateY(0px); opacity: 1; }
	}

	@keyframes move-r {
		0% { transform: translateX(var(--offset-x)) translateY(var(--offset-y)); }
		15% { opacity: 1; }
		50% { transform: translateX(-2px) translateY(35px); }
		100% { transform: translateX(0px) translateY(0px); opacity: 1; }
	}

	@keyframes move-a {
		0% { transform: translateX(var(--offset-x)) translateY(var(--offset-y)); }
		15% { opacity: 1; }
		50% { transform: translateX(0px) translateY(-10px); }
		100% { transform: translateX(0px) translateY(0px); opacity: 1; }
	}

	@keyframes move-c {
		0% { transform: translateX(var(--offset-x)) translateY(var(--offset-y)); }
		15% { opacity: 1; }
		50% { transform: translateX(0px) translateY(16px); }
		100% { transform: translateX(0px) translateY(0px); opacity: 1; }
	}

	@keyframes move-k2 {
		0% { transform: translateX(var(--offset-x)) translateY(var(--offset-y)); }
		15% { opacity: 1; }
		50% { transform: translateX(0px) translateY(-18px); }
		100% { transform: translateX(0px) translateY(0px); opacity: 1; }
	}
</style>

